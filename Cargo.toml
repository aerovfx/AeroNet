[package]
name = "aeronet"
version = "0.3.0"
edition = "2021"
license = "MIT"
authors = ["VietChung"]
description = "A flexible, secure application-layer network foundation for autonomous AI agents"
homepage = "https://aerovfx.com/"
readme = "README.md"
keywords = ["ai-agent", "networking", "identity", "capability", "ed25519"]
categories = ["network-programming", "authentication"]

[[bin]]
name = "broker"
path = "src/bin/broker.rs"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[[bin]]
name = "aeronet-key"
path = "src/bin/key.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
futures-util = "0.3"
rand = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
